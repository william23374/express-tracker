[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "express-tracker"
version = "1.0.0"
description = "Interactive express tracking terminal with pluggable providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
express = "express.__main__:main"
el = "express.__main__:main"

[project.optional-dependencies]
build = [
  "pyinstaller>=6.3",
]

[tool.setuptools.packages.find]
where = ["src"]
